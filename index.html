<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InkTracker" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load font CSS non-render-blocking: the print-media swap lets the browser
         paint immediately (system fallback via display=swap), then upgrades to
         the web fonts once the stylesheet loads. noscript keeps it working with
         JS off. Removes the >1s render-blocking delay Lighthouse flagged. -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" /></noscript>
    <title>InkTracker — Screen Printing Shop Management Software</title>
    <meta name="description" content="Shop management software for screen printers — quotes, production scheduling, invoicing, inventory, and QuickBooks sync. Built after years of using software that never quite fit." />
    <link rel="canonical" href="https://inktracker.app/" />

    <!-- Open Graph / Facebook / iMessage / Slack link previews.
         Without these, social platforms scrape the page and end up
         showing whichever image they find first (used to grab the
         founder bio photo). icon-512.png is the drop logo, 1024×1024. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://inktracker.app/" />
    <meta property="og:title" content="InkTracker — Shop Management for Screen Printers" />
    <meta property="og:description" content="Quotes, production, invoicing — built after years of using software that never quite fit." />
    <meta property="og:image" content="https://inktracker.app/icon-512.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:site_name" content="InkTracker" />

    <!-- Twitter / X card. `summary` (square thumbnail) renders better
         than `summary_large_image` for our square logo. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="InkTracker — Shop Management for Screen Printers" />
    <meta name="twitter:description" content="Quotes, production, invoicing — built after years of using software that never quite fit." />
    <meta name="twitter:image" content="https://inktracker.app/icon-512.png" />

    <!-- Structured data (schema.org JSON-LD). Inert data, not executable —
         read by Google rich results + AI answer engines to describe the
         product. Facts must stay accurate: pricing/features mirror the
         landing page. No AggregateRating until real reviews exist. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://inktracker.app/#organization",
          "name": "InkTracker",
          "url": "https://inktracker.app/",
          "logo": "https://inktracker.app/icon-512.png",
          "description": "Shop management software for screen printing and decorated-apparel shops."
        },
        {
          "@type": "SoftwareApplication",
          "name": "InkTracker",
          "applicationCategory": "BusinessApplication",
          "applicationSubCategory": "Screen Printing Shop Management Software",
          "operatingSystem": "Web",
          "url": "https://inktracker.app/",
          "publisher": { "@id": "https://inktracker.app/#organization" },
          "description": "InkTracker is shop management software for screen printing and embroidery shops — quotes, production scheduling, invoicing, inventory, and customer management with QuickBooks Online sync.",
          "offers": {
            "@type": "Offer",
            "price": "99.00",
            "priceCurrency": "USD",
            "description": "$99/month or $999/year. 14-day free trial, no credit card required."
          },
          "featureList": [
            "Quoting and estimates",
            "Production scheduling",
            "Invoicing and payments",
            "Inventory management",
            "Customer management",
            "Online order wizard",
            "Artwork proofs and approvals",
            "QuickBooks Online sync"
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
