name: tests

# push:main + pull_request covers everything once. The old push:["**"] +
# pull_request:["**"] pair ran CI twice per push to a PR branch — every
# failure meant two "run failed" emails.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    # Dummy (non-secret) Supabase env so the client constructs at import.
    # src/api/supabaseClient.js calls createClient(URL, KEY) at module load and
    # throws "supabaseUrl is required" when unset — any test transitively
    # importing it (e.g. via lib/messageThreads) would fail in CI, which has no
    # .env.local. These are placeholders: tests mock every real call, and prod
    # still gets its real values from Vercel (so a real deploy that forgets them
    # still fails loudly — we're not weakening that).
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Parse-check every Supabase edge function. vitest + Vite build
      # never touch the Deno tree, so a syntax error there ships green
      # and only breaks at deploy (the qbSync double-comma, 2026-06-11).
      # esbuild parse mode — syntax only, no type-check, no false fails.
      - name: Check edge function syntax
        run: npm run check:functions

      # Reproducible edge deploys (supply chain): fail CI if any edge-function
      # dependency drifts from the committed lockfile. `--frozen` errors instead
      # of updating the lock, so a new/changed transitive dep can't ship
      # unpinned. npm: specifiers are already exact-pinned in source; this locks
      # the rest (deno.land/std, etc.).
      # The Deno download flakes with "TypeError: fetch failed" on GitHub's
      # runners (CDN hiccup) — one retry absorbs it instead of failing the run.
      - name: Set up Deno
        id: setup-deno
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      # Back-to-back attempts have both failed inside the same outage window
      # (run 28629984391) — wait out a short CDN blip before retrying.
      - name: Wait before Deno retry
        if: steps.setup-deno.outcome == 'failure'
        run: sleep 30

      - name: Set up Deno (retry)
        if: steps.setup-deno.outcome == 'failure'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Verify edge deps are locked (frozen)
        run: npm run check:functions:lock

      # Edge HANDLER tests — the real handler bodies run under Deno against
      # a fake supabase client (supabase/functions/**/*.deno.test.ts). This
      # is the wiring layer vitest can't reach; the approveArtwork-class
      # leak lived exactly there.
      - name: Edge handler tests (deno)
        run: npm run test:edge

      # Production build — catches things vitest can't, like orphan
      # imports from pages that aren't unit-tested. Vercel runs the
      # same command at deploy time, so a green check here matches
      # what'll happen in production. SENTRY_AUTH_TOKEN is not set
      # in CI; sentry-vite-plugin no-ops the source-map upload when
      # the token is absent, so this works without secrets.
      - name: Production build
        run: npm run build
