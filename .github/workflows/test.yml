name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Parse-check every Supabase edge function. vitest + Vite build
      # never touch the Deno tree, so a syntax error there ships green
      # and only breaks at deploy (the qbSync double-comma, 2026-06-11).
      # esbuild parse mode — syntax only, no type-check, no false fails.
      - name: Check edge function syntax
        run: npm run check:functions

      # Production build — catches things vitest can't, like orphan
      # imports from pages that aren't unit-tested. Vercel runs the
      # same command at deploy time, so a green check here matches
      # what'll happen in production. SENTRY_AUTH_TOKEN is not set
      # in CI; sentry-vite-plugin no-ops the source-map upload when
      # the token is absent, so this works without secrets.
      - name: Production build
        run: npm run build
