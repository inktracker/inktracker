name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Production build — catches things vitest can't, like orphan
      # imports from pages that aren't unit-tested. Vercel runs the
      # same command at deploy time, so a green check here matches
      # what'll happen in production. SENTRY_AUTH_TOKEN is not set
      # in CI; sentry-vite-plugin no-ops the source-map upload when
      # the token is absent, so this works without secrets.
      - name: Production build
        run: npm run build
