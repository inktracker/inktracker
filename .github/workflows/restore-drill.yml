name: Restore drill

# OPS-03, automated: proves the entire recovery chain works — schema rebuilds
# from an empty Postgres using supabase/migrations/ alone, a JSONL export
# loads through the REAL restore script (scripts/restore-database.mjs), and
# the restored data passes the same integrity oracle the nightly cron runs
# in production. An un-restorable backup or un-replayable migration fails
# this job loudly instead of being discovered mid-disaster.
#
# Runs weekly + on any PR touching the schema or the backup/restore chain.
# The measured wall-clock of the "drill" step is the RTO floor for the
# restore portion of an incident (docs/disaster-recovery.md).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, after the weekend backups
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/backup-*.mjs"
      - "scripts/restore-database.mjs"
      - "scripts/restore-drill/**"
      - ".github/workflows/db-backup.yml"
      - ".github/workflows/storage-backup.yml"
      - ".github/workflows/restore-drill.yml"
  workflow_dispatch: {}

concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:drill@localhost:5432/drill
      DRILL_PSQL: psql postgres://postgres:drill@localhost:5432/drill
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install deps (pg driver)
        run: npm ci --omit=optional 2>/dev/null || npm install pg
      - name: "Drill 1/3 — replay every migration onto empty Postgres"
        run: |
          START=$(date +%s)
          ./scripts/restore-drill/replay-migrations.sh
          echo "REPLAY_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: "Drill 2/3 — restore the fixture export via the real restore path"
        run: |
          START=$(date +%s)
          node scripts/restore-database.mjs scripts/restore-drill/fixture
          echo "RESTORE_SECONDS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
      - name: "Drill 3/3 — assert tables, row counts, and integrity oracle"
        run: node scripts/restore-drill/verify-restore.mjs
      - name: Report measured RTO signal
        run: |
          echo "### Restore drill ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- migrations replay: ${REPLAY_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- fixture restore + verify: ${RESTORE_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- (RTO floor for the DB-restore portion of an incident; full-incident target lives in docs/disaster-recovery.md)" >> "$GITHUB_STEP_SUMMARY"
