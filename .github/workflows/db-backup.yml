name: DB backup

# Off-platform logical DATA backup of every public table. The Supabase org
# is on the FREE plan — no automated database backups exist until the Pro
# upgrade (planned at 5 paying shops). Until then this nightly export is
# the only recovery point for quotes/orders/invoices/customers/expenses.
#
# Schema restores from supabase/migrations/; auth.users identities are NOT
# covered (auth schema is unreachable over PostgREST) — users re-verify by
# email after a restore. Storage is covered by storage-backup.yml.
#
# Uses the same repo secrets as the storage backup:
#   SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY
#
# NOTE: artifact retention is capped (30d) — this is a recovery point, not
# a substitute for real Supabase backups. Delete this workflow after the
# Pro upgrade if you'd rather not keep both.
#
# DEAD-MAN'S-SWITCH: a failed run shows a red ❌ + emails admins, but nothing
# fires if the schedule silently STOPS running (GitHub disables schedules
# after 60d of repo inactivity, scheduler outages, a manual disable) — i.e.
# you could go days with NO backup and no signal. On a successful backup we
# ping an external monitor; configure a free healthchecks.io check (period
# 1 day, grace 2h) and add its ping URL as a repo secret so it pages if no
# ping arrives in ~26h:
#   gh secret set HEALTHCHECK_DB_BACKUP_URL   # https://hc-ping.com/<uuid>
# (Optional — the heartbeat step no-ops if the secret is unset. The `/fail`
# suffix on a failure also pings immediately so you hear about it that night.)

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily (before storage backup 04:30 + reconcile 05:00)
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install supabase-js
        run: npm ci --omit=dev || npm install @supabase/supabase-js@2
      - name: Export public tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY repo secrets not set."
            exit 1
          fi
          node scripts/backup-database.mjs
      - name: Upload backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-backup-${{ github.run_id }}
          path: db-backup/
          retention-days: 30
          if-no-files-found: error
      - name: Heartbeat (dead-man's-switch)
        # Only reached when the export + upload BOTH succeeded (prior steps
        # exit non-zero on any failure). Pings the external monitor so it
        # pages if the backup ever stops running entirely.
        env:
          HEALTHCHECK_DB_BACKUP_URL: ${{ secrets.HEALTHCHECK_DB_BACKUP_URL }}
        run: |
          if [ -n "$HEALTHCHECK_DB_BACKUP_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_DB_BACKUP_URL" >/dev/null && echo "heartbeat sent"
          else
            echo "HEALTHCHECK_DB_BACKUP_URL not set — skipping heartbeat (see workflow header to enable the dead-man's-switch)."
          fi
      - name: Alert on failure
        # Immediate page the same night if the backup failed, via the monitor's
        # /fail endpoint — complements GitHub's email-on-failure. No-ops if unset.
        if: failure()
        env:
          HEALTHCHECK_DB_BACKUP_URL: ${{ secrets.HEALTHCHECK_DB_BACKUP_URL }}
        run: |
          if [ -n "$HEALTHCHECK_DB_BACKUP_URL" ]; then
            curl -fsS -m 10 --retry 3 "${HEALTHCHECK_DB_BACKUP_URL%/}/fail" >/dev/null && echo "failure signal sent"
          fi
