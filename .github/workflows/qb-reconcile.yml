name: QB nightly reconcile

# Reliable trigger for the QuickBooks reconciliation cron. Replaces the
# Vercel cron in vercel.json, which stopped firing (Vercel Hobby crons are
# best-effort and were silently skipping runs — so missed-payment recovery
# AND the webhook-health alert never ran). GitHub's scheduler is far more
# reliable for this, runs free, and a failure shows a red ❌ on the repo.
#
# Hits the Supabase edge function directly with CRON_SECRET (the same auth
# the function already checks — no Vercel proxy needed).
#
# SETUP (one-time): add a repo secret named CRON_SECRET whose value matches
# the Supabase `CRON_SECRET` function secret:
#   gh secret set CRON_SECRET        # paste the value
# Test immediately via the "Run workflow" button (workflow_dispatch).
#
# DEAD-MAN'S-SWITCH (audit OPS-05): a failed run shows a red ❌ + emails admins,
# but nothing fires if the cron silently STOPS running (disabled, scheduler
# outage) — that recreated the original 9-month blindspot. Fix: on success we
# ping an external monitor; configure a free healthchecks.io check (period
# 1 day, grace 2h) and add its ping URL as a repo secret so it pages if no ping
# arrives in ~26h:
#   gh secret set HEALTHCHECK_RECONCILE_URL   # https://hc-ping.com/<uuid>
# (Optional — the heartbeat step no-ops if the secret is unset.)

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily — matches the old Vercel schedule
  workflow_dispatch: {} # manual trigger for testing

# Don't pile up overlapping runs if one is slow.
concurrency:
  group: qb-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger qbReconcile
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set — add it (must match the Supabase CRON_SECRET)."
            exit 1
          fi
          code=$(curl -sS -o /tmp/reconcile.json -w "%{http_code}" -X POST \
            "https://skmltfbibaqcjddmeqvi.supabase.co/functions/v1/qbReconcile" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data "{}")
          echo "HTTP $code"
          cat /tmp/reconcile.json | head -c 4000; echo
          if [ "$code" != "200" ]; then
            echo "::error::qbReconcile returned $code (401 = CRON_SECRET mismatch with Supabase)."
            exit 1
          fi
      - name: Heartbeat (dead-man's-switch)
        # Only reached on a SUCCESSFUL reconcile (prior step exits 1 on failure).
        # Pings the external monitor so it pages if the cron ever stops pinging.
        env:
          HEALTHCHECK_RECONCILE_URL: ${{ secrets.HEALTHCHECK_RECONCILE_URL }}
        run: |
          if [ -n "$HEALTHCHECK_RECONCILE_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_RECONCILE_URL" >/dev/null && echo "heartbeat sent"
          else
            echo "HEALTHCHECK_RECONCILE_URL not set — skipping heartbeat (see workflow header to enable the dead-man's-switch)."
          fi
