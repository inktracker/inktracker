name: e2e

# End-to-end Playwright tests (auth + tenant scoping + manager
# permissions). Runs post-merge on main and on demand. NOT a required
# PR check — it touches the live Supabase project (creates + tears down
# throwaway test users/shops) and needs secrets, so we keep it off the
# per-PR fast path.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL          — the project URL (use a THROWAWAY/staging project)
#   VITE_SUPABASE_ANON_KEY     — that project's anon key; the new isolation /
#                                subscription specs sign in as a real client to
#                                assert RLS + storage policies actually deny
#   SUPABASE_SERVICE_ROLE_KEY  — used by e2e/_helpers to create/delete
#                                test fixtures (never reaches the browser)
#
# To make this a REQUIRED per-PR gate (the regression net's purpose), the human:
#   1. points the secrets above at a THROWAWAY test project (NOT prod — the
#      specs create/delete users/shops and run the purge),
#   2. adds `pull_request:` + `push: branches: [main]` to the `on:` block below,
#   3. enables branch protection requiring this check (Settings → Branches).

on:
  workflow_dispatch:
  # Flip on push:main once VITE_SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY
  # repo secrets are set (Settings -> Secrets -> Actions), else main runs red.

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
