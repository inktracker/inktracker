name: Storage backup

# Off-platform backup of Supabase Storage (audit OPS-02). Supabase's daily
# backup covers Postgres only — NOT Storage — so artwork + tax-exemption certs
# would be unrecoverable after a DB restore. This downloads both buckets nightly
# and keeps them as a GitHub artifact (independent of the Supabase project).
#
# SETUP (one-time repo secrets):
#   gh secret set SUPABASE_URL                 # https://<ref>.supabase.co
#   gh secret set SUPABASE_SERVICE_ROLE_KEY    # service_role key
#
# NOTE: artifact retention is capped (30d here) and large buckets count toward
# storage limits — this is a recovery point, not a substitute for the
# Supabase-side backups. Restore steps: docs/disaster-recovery.md.

on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC daily (before the 05:00 reconcile)
  workflow_dispatch: {}

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install supabase-js
        run: npm ci --omit=dev || npm install @supabase/supabase-js@2
      - name: Fetch previous run's manifest (T3 comparison baseline)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow "Storage backup" --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -n storage-backup-manifest -D prev-manifest \
              && echo "previous manifest from run $RUN_ID" \
              || echo "no previous manifest artifact — first run with manifests"
          else
            echo "no previous successful run — comparison will be skipped"
          fi
      - name: Export storage buckets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PREV_MANIFEST: prev-manifest/manifest.json
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY repo secrets not set."
            exit 1
          fi
          node scripts/backup-storage.mjs
      - name: Mirror to offsite bucket (T2 — no-op until BACKUP_S3_* secrets exist)
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
        run: node scripts/offsite-mirror.mjs storage-backup storage
      - name: Upload backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-backup-${{ github.run_id }}
          path: storage-backup/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload manifest (small, long retention — next run's baseline)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-backup-manifest
          path: storage-backup/manifest.json
          retention-days: 90
          overwrite: true
      - name: Dead-man's-switch heartbeat (OPS-05 pattern)
        if: success()
        env:
          HEALTHCHECK_BACKUP_URL: ${{ secrets.HEALTHCHECK_BACKUP_URL }}
        run: |
          if [ -n "$HEALTHCHECK_BACKUP_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_BACKUP_URL" >/dev/null && echo "heartbeat sent"
          else
            echo "HEALTHCHECK_BACKUP_URL not set — no dead-man's-switch. Create a healthchecks.io check (~26h grace) and 'gh secret set HEALTHCHECK_BACKUP_URL'."
          fi
      - name: Signal failure to the monitor
        if: failure()
        env:
          HEALTHCHECK_BACKUP_URL: ${{ secrets.HEALTHCHECK_BACKUP_URL }}
        run: |
          if [ -n "$HEALTHCHECK_BACKUP_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_BACKUP_URL/fail" >/dev/null || true
          fi
