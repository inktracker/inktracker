name: Storage backup

# Off-platform backup of Supabase Storage (audit OPS-02). Supabase's daily
# backup covers Postgres only — NOT Storage — so artwork + tax-exemption certs
# would be unrecoverable after a DB restore. This downloads both buckets nightly
# and keeps them as a GitHub artifact (independent of the Supabase project).
#
# SETUP (one-time repo secrets):
#   gh secret set SUPABASE_URL                 # https://<ref>.supabase.co
#   gh secret set SUPABASE_SERVICE_ROLE_KEY    # service_role key
#
# NOTE: artifact retention is capped (30d here) and large buckets count toward
# storage limits — this is a recovery point, not a substitute for the
# Supabase-side backups. Restore steps: docs/disaster-recovery.md.
#
# DEAD-MAN'S-SWITCH: a failed run emails admins, but nothing fires if the
# schedule silently STOPS running. On success we ping an external monitor;
# configure a free healthchecks.io check (period 1 day, grace 2h) and add its
# ping URL as a repo secret so it pages if no ping arrives in ~26h:
#   gh secret set HEALTHCHECK_STORAGE_BACKUP_URL   # https://hc-ping.com/<uuid>
# (Optional — the heartbeat no-ops if unset. `/fail` pings on failure too.)

on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC daily (before the 05:00 reconcile)
  workflow_dispatch: {}

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install supabase-js
        run: npm ci --omit=dev || npm install @supabase/supabase-js@2
      - name: Export storage buckets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY repo secrets not set."
            exit 1
          fi
          node scripts/backup-storage.mjs
      - name: Upload backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storage-backup-${{ github.run_id }}
          path: storage-backup/
          retention-days: 30
          # error, not warn: an EMPTY storage backup (both buckets skipped) must
          # fail — a live shop always has artwork/certs, so zero files = broken.
          if-no-files-found: error
      - name: Heartbeat (dead-man's-switch)
        # Only reached when the export + upload BOTH succeeded (the script now
        # exits non-zero on any skipped bucket / failed download).
        env:
          HEALTHCHECK_STORAGE_BACKUP_URL: ${{ secrets.HEALTHCHECK_STORAGE_BACKUP_URL }}
        run: |
          if [ -n "$HEALTHCHECK_STORAGE_BACKUP_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_STORAGE_BACKUP_URL" >/dev/null && echo "heartbeat sent"
          else
            echo "HEALTHCHECK_STORAGE_BACKUP_URL not set — skipping heartbeat (see workflow header to enable the dead-man's-switch)."
          fi
      - name: Alert on failure
        if: failure()
        env:
          HEALTHCHECK_STORAGE_BACKUP_URL: ${{ secrets.HEALTHCHECK_STORAGE_BACKUP_URL }}
        run: |
          if [ -n "$HEALTHCHECK_STORAGE_BACKUP_URL" ]; then
            curl -fsS -m 10 --retry 3 "${HEALTHCHECK_STORAGE_BACKUP_URL%/}/fail" >/dev/null && echo "failure signal sent"
          fi
