# Automated dependency-update PRs. Keeps npm packages and the pinned
# GitHub Actions SHAs current, so security patches land as reviewable PRs
# (which run the full CI + the new Security workflow) instead of silently
# rotting. Minor/patch bumps are grouped into one PR to limit noise; majors
# get their own PR so breaking changes are reviewed individually.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-all:
        update-types: ["minor", "patch"]
