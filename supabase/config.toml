# Declared explicitly so the JWT posture is reviewed, not inherited silently.
# Both handle auth internally like every other function: profileSecrets
# validates the caller's user JWT itself (401s without one); redditScan gates
# on CRON_SECRET/REDDIT_SCAN_CRON_TOKEN via timingSafeEqual.
