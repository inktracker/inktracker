<!--
Subject: You've been invited to InkTracker
-->
<!--
  Notes for future-Joe:
  - The Google Fonts @import that used to be here was stripped by every
    email client we tested (Gmail web, Gmail iOS, Apple Mail, Outlook
    web). Removed in favor of a system-font stack — the Anton header was
    falling back to default-serif anyway, which looked worse than a
    clean Impact/Arial Narrow.
  - The two color-scheme meta tags below tell Gmail dark-mode and Apple
    Mail not to auto-invert our explicit white-on-dark header. Without
    them, the InkTracker header text rendered as dark-on-dark (illegible)
    in Gmail dark mode — the 2026-05-31 screenshot from Joe.
  - {{ .Email }} is wrapped in an <a mailto: …> that explicitly inherits
    the surrounding text color and removes underline. Without this,
    Gmail auto-detects the plain-text email and renders it as a huge
    bright-blue link that dominates the email visually.
-->
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">

<div style="background-color:#f5f5f3;padding:24px 16px;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0e0e0e;">
  <div style="max-width:560px;margin:0 auto;background-color:#ffffff;border:1px solid #e5e5e5;">

    <!-- Header -->
    <div style="background-color:#1a3a28;padding:32px 28px;text-align:center;">
      <img src="https://www.inktracker.app/icon-512.png" alt="InkTracker" width="52" height="52" style="display:block;border:0;outline:none;margin:0 auto 12px;" />
      <div style="color:#ffffff !important;font-family:Impact,'Arial Narrow Bold',sans-serif;font-size:26px;line-height:1;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;">InkTracker</div>
    </div>

    <!-- Body -->
    <div style="padding:36px 32px 32px;font-size:15px;line-height:1.6;color:#1a1a1a;">

      <h1 style="margin:0 0 12px;font-size:22px;font-weight:700;color:#0e0e0e;letter-spacing:-0.01em;line-height:1.25;">
        You've been invited to join InkTracker
      </h1>

      <p style="margin:0 0 28px;color:#4a4a4a;font-size:15px;">
        A teammate added you to their shop. Click below to create your account.
      </p>

      <div style="text-align:center;margin:0 0 18px;">
        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block;background-color:#2c5840;color:#ffffff !important;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:14px 36px;text-decoration:none;border-radius:4px;mso-padding-alt:0;">
          Accept Invitation
        </a>
      </div>

      <p style="margin:0;color:#888;font-size:13px;text-align:center;">
        Invited as
        <a href="mailto:{{ .Email }}" style="color:#888 !important;text-decoration:none;font-weight:600;">{{ .Email }}</a>
      </p>

      <p style="margin:32px 0 0;color:#999;font-size:12px;line-height:1.5;text-align:center;">
        Not expecting this? You can safely ignore this email.
      </p>

    </div>

  </div>
</div>
